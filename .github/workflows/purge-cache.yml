name: Purge Actions cache

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    name: Purge all Actions caches
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Delete all caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY"
