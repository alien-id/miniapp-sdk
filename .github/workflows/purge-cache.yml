name: Purge Actions cache

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    name: Purge all Actions caches
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Delete all caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY"
